<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visit Entry Form</title>
  <style>
    :root {
      --primary: #1f6feb;
      --primary-dark: #1658c2;
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #667085;
      --border: #d0d5dd;
      --error: #d92d20;
      --success-bg: #ecfdf3;
      --success-text: #067647;
      --error-bg: #fef3f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(16, 24, 40, 0.08);
      padding: 20px 18px 24px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 18px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; }
    .req { color: var(--error); }
    .opt { color: var(--muted); font-weight: 400; font-size: 0.82rem; }
    input, textarea {
      width: 100%;
      padding: 11px 12px;
      font-size: 16px; /* 16px se mobile par zoom nahi hota */
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
    }
    input.invalid, textarea.invalid { border-color: var(--error); }
    .err { color: var(--error); font-size: 0.8rem; margin-top: 4px; min-height: 0; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; gap: 0; } }
    button {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { display: none; margin-top: 14px; padding: 12px; border-radius: 9px; font-size: 0.92rem; }
    .msg.success { display: block; background: var(--success-bg); color: var(--success-text); }
    .msg.error { display: block; background: var(--error-bg); color: var(--error); }
    .upper { text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Visit Entry Form</h1>
      <p class="sub"><span class="req">*</span> wale fields bharna zaroori hai</p>

      <form id="visitForm" novalidate>
        <div class="field">
          <label for="salesPerson">Sales Person Name <span class="req">*</span></label>
          <input type="text" id="salesPerson" name="salesPerson" autocomplete="name" maxlength="60" />
          <div class="err" data-for="salesPerson"></div>
        </div>

        <div class="field">
          <label for="visitDate">Visit Date <span class="req">*</span></label>
          <input type="date" id="visitDate" name="visitDate" />
          <div class="err" data-for="visitDate"></div>
        </div>

        <div class="field">
          <label for="partyName">Party Name <span class="req">*</span></label>
          <input type="text" id="partyName" name="partyName" maxlength="120" />
          <div class="err" data-for="partyName"></div>
        </div>

        <div class="field">
          <label for="contactPerson">Contact Person Name <span class="req">*</span></label>
          <input type="text" id="contactPerson" name="contactPerson" maxlength="80" />
          <div class="err" data-for="contactPerson"></div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="primaryMobile">Primary Mob No. <span class="req">*</span></label>
            <input type="tel" id="primaryMobile" name="primaryMobile" inputmode="numeric" maxlength="10" placeholder="10 digit" />
            <div class="err" data-for="primaryMobile"></div>
          </div>
          <div class="field">
            <label for="altMobile">Alternate Mob No. <span class="opt">(optional)</span></label>
            <input type="tel" id="altMobile" name="altMobile" inputmode="numeric" maxlength="10" placeholder="10 digit" />
            <div class="err" data-for="altMobile"></div>
          </div>
        </div>

        <div class="field">
          <label for="gst">GST Number <span class="req">*</span></label>
          <input type="text" id="gst" name="gst" class="upper" maxlength="15" placeholder="jaise 08ABCDE1234F1Z5" autocomplete="off" />
          <div class="err" data-for="gst"></div>
        </div>

        <div class="field">
          <label for="address">Full Address <span class="req">*</span></label>
          <textarea id="address" name="address" maxlength="500"></textarea>
          <div class="err" data-for="address"></div>
        </div>

        <div class="field">
          <label for="pincode">Pin Code <span class="req">*</span></label>
          <input type="tel" id="pincode" name="pincode" inputmode="numeric" maxlength="6" placeholder="6 digit" />
          <div class="err" data-for="pincode"></div>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script>
    // ======================================================
    // STEP: Apps Script deploy karne ke baad mila Web App URL yahan paste karein
    // ======================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtuLYaS06rAGmAuUjbsqcN9_b_QGd7dOLSEPUYf5cuGgJw3LEvi0wXXp4aWVBM0882/exec";

    const form = document.getElementById("visitForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    // Aaj ki date default set karein (local time ke hisaab se)
    function todayStr() {
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }
    document.getElementById("visitDate").value = todayStr();

    // Number fields me sirf digits allow karein
    ["primaryMobile", "altMobile", "pincode"].forEach(id => {
      document.getElementById(id).addEventListener("input", e => {
        e.target.value = e.target.value.replace(/\D/g, "");
      });
    });
    // GST ko automatic capital letters me badlein, space hata dein
    document.getElementById("gst").addEventListener("input", e => {
      e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, "");
    });

    const MOBILE_RE = /^[6-9]\d{9}$/;
    const PIN_RE = /^[1-9]\d{5}$/;
    const GST_RE = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;

    function setError(id, text) {
      const input = document.getElementById(id);
      const box = document.querySelector('.err[data-for="' + id + '"]');
      box.textContent = text || "";
      input.classList.toggle("invalid", !!text);
    }

    function validate() {
      const v = id => document.getElementById(id).value.trim();
      let ok = true;
      const check = (id, cond, text) => {
        if (!cond) { setError(id, text); ok = false; } else { setError(id, ""); }
      };

      check("salesPerson", v("salesPerson").length >= 2, "Sales Person ka naam likhein.");
      check("visitDate", v("visitDate") !== "", "Visit date chunein.");
      check("partyName", v("partyName") !== "", "Party ka naam likhein.");
      check("contactPerson", v("contactPerson") !== "", "Contact person ka naam likhein.");
      check("primaryMobile", MOBILE_RE.test(v("primaryMobile")), "Sahi 10 digit mobile number daalein (6/7/8/9 se shuru).");

      const alt = v("altMobile");
      if (alt === "") {
        setError("altMobile", "");
      } else if (!MOBILE_RE.test(alt)) {
        setError("altMobile", "Alternate number 10 digit ka hona chahiye, ya khaali chhod dein.");
        ok = false;
      } else if (alt === v("primaryMobile")) {
        setError("altMobile", "Alternate number primary se alag hona chahiye.");
        ok = false;
      } else {
        setError("altMobile", "");
      }

      check("gst", GST_RE.test(v("gst")), "GST number sahi format me 15 character ka hona chahiye.");
      check("address", v("address").length >= 5, "Poora address likhein.");
      check("pincode", PIN_RE.test(v("pincode")), "Sahi 6 digit pin code daalein.");

      return ok;
    }

    function showMsg(type, text) {
      msg.className = "msg " + type;
      msg.textContent = text;
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      msg.className = "msg";

      if (!validate()) {
        showMsg("error", "Kripya laal rang wale fields theek karein.");
        const firstBad = form.querySelector(".invalid");
        if (firstBad) firstBad.focus();
        return;
      }
      if (!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_") === 0) {
        showMsg("error", "Setup adhoora hai: index.html me SCRIPT_URL nahi lagaya gaya.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Submit ho raha hai...";

      try {
        // URLSearchParams = simple form POST, isse CORS ki dikkat nahi aati
        const body = new URLSearchParams(new FormData(form));
        const res = await fetch(SCRIPT_URL, { method: "POST", body: body });
        const result = await res.json();

        if (result.status === "success") {
          showMsg("success", result.message || "Entry save ho gayi!");
          const keepName = document.getElementById("salesPerson").value;
          form.reset();
          // Agli entry ke liye sales person ka naam aur aaj ki date wapas bhar dein
          document.getElementById("salesPerson").value = keepName;
          document.getElementById("visitDate").value = todayStr();
        } else {
          showMsg("error", result.message || "Kuch gadbad hui, dobara try karein.");
        }
      } catch (err) {
        showMsg("error", "Network error: internet check karke dobara try karein.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
